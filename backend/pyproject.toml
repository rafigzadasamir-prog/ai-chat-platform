[project]
name = "ai-chat-platform-backend"
version = "0.1.0"
description = "Backend API for the AI Chat Platform: auth, conversations, streaming chat, lightweight RAG grounding and usage metering."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Samir Rafigzada", email = "rafigzadasamir@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "passlib>=1.7.4",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "anthropic>=0.34.0",
]

[project.optional-dependencies]
rag-ml = [
    # Optional, heavier embedding backend. When installed and a model is
    # available locally, the app automatically prefers it over the
    # dependency-free HashingEmbedder fallback. See app/embeddings.py.
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
